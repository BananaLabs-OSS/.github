name: Reusable Go CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Go module directory
        required: false
        type: string
        default: .
      sibling-repositories:
        description: Newline-separated public owner/repository checkouts required by local replace directives
        required: false
        type: string
        default: ""
      race:
        description: Run the Go race detector
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out sibling modules
        if: inputs.sibling-repositories != ''
        env:
          SIBLING_REPOSITORIES: ${{ inputs.sibling-repositories }}
        shell: bash
        run: |
          while IFS= read -r repository; do
            [[ -z "$repository" ]] && continue
            if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "invalid sibling repository: $repository" >&2
              exit 1
            fi
            git clone --depth=1 "https://github.com/${repository}.git" "../${repository##*/}"
          done <<< "$SIBLING_REPOSITORIES"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: Test
        if: ${{ !inputs.race }}
        run: go test ./...
      - name: Test with race detector
        if: inputs.race
        run: go test -race ./...
